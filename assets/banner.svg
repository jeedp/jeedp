<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="t d">
  <title id="t">Jed B. Padro</title>
  <desc id="d">Computer Engineering student at SLSU, developing toward software engineering, AI/ML and IoT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#160B0F"/>
      <stop offset="1" stop-color="#3A0911"/>
    </linearGradient>
    <radialGradient id="glow" cx="810" cy="130" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#800000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#800000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F0A8B0" opacity="0.10"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .name { font: 700 62px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F7ECEE; }
    .label { font: 600 15px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #E07A88; letter-spacing: 3px; }
    .tag { font: 400 20px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #F0A8B0; }
    .chip { font: 700 30px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #F0A8B0; }
    .tr { fill: none; stroke: #9B2335; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .via { fill: #0D1117; stroke: #C1354A; stroke-width: 2; }
    .p { fill: none; stroke: #F7C6CC; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
         stroke-dasharray: 7 193; stroke-dashoffset: 200; animation: run 4.5s linear infinite; }
    .p2 { animation-delay: -1.1s; } .p3 { animation-delay: -2.3s; } .p4 { animation-delay: -3.4s; }
    .led { animation: blink 2.4s ease-in-out infinite; }
    @keyframes run { to { stroke-dashoffset: 0; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) { .p { animation: none; opacity: 0; } .led { animation: none; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#dots)"/>
    <rect width="1000" height="260" fill="url(#glow)"/>

    <!-- traces -->
    <g class="tr">
      <path d="M755 95 H700 L670 65 H600"/>
      <path d="M755 112 H660 L640 92 H575"/>
      <path d="M755 130 H590"/>
      <path d="M755 148 H660 L640 168 H570"/>
      <path d="M755 165 H700 L670 195 H610"/>
      <path d="M775 75 V40 L755 20 V0"/>
      <path d="M792 75 V48"/>
      <path d="M810 75 V0"/>
      <path d="M828 75 V55"/>
      <path d="M845 75 V50 L875 20 H1000"/>
      <path d="M865 95 H910 L935 70 H1000"/>
      <path d="M865 112 H890"/>
      <path d="M865 130 H1000"/>
      <path d="M865 148 H925"/>
      <path d="M865 165 H905 L935 195 H1000"/>
      <path d="M775 185 V215 L750 240 V260"/>
      <path d="M792 185 V208"/>
      <path d="M810 185 V260"/>
      <path d="M828 185 V222"/>
      <path d="M845 185 V210 L880 245 H1000"/>
    </g>

    <!-- signal pulses travelling along the traces -->
    <path class="p" pathLength="200" d="M600 65 H670 L700 95 H755"/>
    <path class="p p3" pathLength="200" d="M590 130 H755"/>
    <path class="p p2" pathLength="200" d="M610 195 H670 L700 165 H755"/>
    <path class="p p4" pathLength="200" d="M865 95 H910 L935 70 H1000"/>
    <path class="p p2" pathLength="200" d="M865 130 H1000"/>
    <path class="p p3" pathLength="200" d="M845 185 V210 L880 245 H1000"/>
    <path class="p p4" pathLength="200" d="M810 75 V0"/>

    <!-- vias -->
    <g class="via">
      <circle cx="600" cy="65" r="5"/><circle cx="575" cy="92" r="5"/><circle cx="590" cy="130" r="5"/>
      <circle cx="570" cy="168" r="5"/><circle cx="610" cy="195" r="5"/>
      <circle cx="792" cy="48" r="5"/><circle cx="828" cy="55" r="5"/>
      <circle cx="890" cy="112" r="5"/><circle cx="925" cy="148" r="5"/>
      <circle cx="792" cy="208" r="5"/><circle cx="828" cy="222" r="5"/>
    </g>

    <!-- chip -->
    <rect x="755" y="75" width="110" height="110" rx="10" fill="#14080B" stroke="#C1354A" stroke-width="2"/>
    <rect x="765" y="85" width="90" height="90" rx="5" fill="none" stroke="#5C1420" stroke-width="1"/>
    <circle class="led" cx="775" cy="95" r="3.5" fill="#F7C6CC"/>
    <text class="chip" x="810" y="141" text-anchor="middle">JP</text>

    <!-- text -->
    <text class="label" x="60" y="82">COMPUTER ENGINEERING STUDENT · SLSU</text>
    <text class="name" x="57" y="146">Jed B. Padro</text>
    <rect x="60" y="166" width="64" height="4" rx="2" fill="#A4161A"/>
    <text class="tag" x="60" y="204">software engineering · AI/ML · IoT</text>
  </g>
</svg>
