<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Closing note: Open to internships and collaborations. Jed B. Padro, BS Computer Engineering, Southern Leyte State University.">
<style>
.rule{transform-box:fill-box;transform-origin:left center;animation:wipe 1.3s cubic-bezier(0.16, 1, 0.3, 1) .1s both}
.a{animation:rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) .35s both} .b{animation:rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) .6s both}
.swash{animation:pen 1.6s cubic-bezier(.5,0,.2,1) 1s both} .box{animation:pen 1.8s cubic-bezier(.45,0,.2,1) .5s both}
.mono{animation:fade 1.2s ease-out 1.3s both}
@keyframes wipe{from{transform:scaleX(0)}} @keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes pen{from{stroke-dashoffset:1}} @keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect width="1200" height="230" rx="14" fill="#130D0F"/>
<rect class="rule" x="56" y="34" width="1088" height="1.5" fill="#F2EBE6"/>
<text class="a" x="56" y="70" font-family="'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="2.6" fill="#D47C86">CLOSING NOTE</text>
<text class="a" x="56" y="116" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-style="italic" font-size="32" fill="#F2EBE6">Open to internships and collaborations.</text>
<text class="b" x="56" y="158" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="22" fill="#F2EBE6">Jed B. Padro</text>
<path class="swash" d="M56 166 C 95.6 175, 148.4 163, 218.0 165 S 248.0 154, 234.0 150" fill="none" stroke="#D47C86" stroke-width="1.6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<text class="b" x="56" y="196" font-family="'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="12" letter-spacing="1.2" fill="#A8999B">BS Computer Engineering · Southern Leyte State University</text>
<path class="box" d="M1024 58H1144V178H1024Z" fill="none" stroke="#D47C86" stroke-width="1.5" pathLength="1" stroke-dasharray="1 1"/>
<g class="mono" text-anchor="middle"><text x="1084" y="133" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="46" fill="#D47C86">JP</text>
<text x="1084" y="204" font-family="'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="10" letter-spacing="2.4" fill="#A8999B">SINCE 2024</text></g>
</svg>
