<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Jed B. Padro</title>
  <desc id="d">Computer Engineering student at Southern Leyte State University. Software engineer in the making, hardware-literate by training.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCF8F5"/><stop offset="0.6" stop-color="#FCF8F5"/><stop offset="1" stop-color="#F4DFE1"/>
    </linearGradient>
    <radialGradient id="glow" cx="880" cy="105" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#800000" stop-opacity="0.14"/><stop offset="1" stop-color="#800000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#800000" opacity="0.10"/></pattern>
    <clipPath id="clip"><rect width="1000" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; } .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .t { fill: #2A0A0F; } .m { fill: #7A5A5E; } .a { fill: #A4161A; }
    .ln { fill: none; stroke: #B5586A; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .la { fill: none; stroke: #A4161A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .sh { fill: #FFFFFF; stroke: #B5586A; stroke-width: 2; stroke-linejoin: round; }
    
    .pulse { fill: none; stroke: #FF4D6A; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 194; stroke-dashoffset: 200; animation: run 5s linear infinite; }
    .nd { fill: #FFFFFF; stroke: #A4161A; stroke-width: 2.5; }
    .on { fill: #A4161A; opacity: 0; animation: lit 5s linear infinite; }
    .n2 { animation-delay: 1.66s; } .n3 { animation-delay: 3.33s; } .n4 { animation-delay: 4.9s; }
    @keyframes run { to { stroke-dashoffset: 0; } }
    @keyframes lit { 0%, 12%, 100% { opacity: 0; } 3% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#dots)"/>
    <rect width="1000" height="300" fill="url(#glow)"/>
    <text class="mono a" x="56" y="66" font-size="13" letter-spacing="3">COMPUTER ENGINEERING · SOUTHERN LEYTE STATE UNIVERSITY</text>
    <text class="sans t" x="52" y="150" font-size="78" font-weight="800" letter-spacing="-1.5">Jed B. Padro</text>
    <text class="sans m" x="56" y="192" font-size="22">Software engineer in the making. Hardware-literate by training.</text>
    <rect x="884" y="36" width="60" height="60" rx="10" fill="#FFFFFF" stroke="#A4161A" stroke-width="2"/>
    <text class="mono a" x="914" y="74" font-size="22" font-weight="700" text-anchor="middle">JP</text>
    <path class="ln" d="M56 244 H944"/>
    <path class="pulse" pathLength="200" d="M56 244 H944"/>
    <circle class="nd" cx="56" cy="244" r="7"/><circle class="on n1" cx="56" cy="244" r="4"/>
    <text class="mono m" x="56" y="274" font-size="12" letter-spacing="2.5" text-anchor="start">HARDWARE</text>
    <circle class="nd" cx="352" cy="244" r="7"/><circle class="on n2" cx="352" cy="244" r="4"/>
    <text class="mono m" x="352" y="274" font-size="12" letter-spacing="2.5" text-anchor="middle">FIRMWARE</text>
    <circle class="nd" cx="648" cy="244" r="7"/><circle class="on n3" cx="648" cy="244" r="4"/>
    <text class="mono m" x="648" y="274" font-size="12" letter-spacing="2.5" text-anchor="middle">BACKEND</text>
    <circle class="nd" cx="944" cy="244" r="7"/><circle class="on n4" cx="944" cy="244" r="4"/>
    <text class="mono m" x="944" y="274" font-size="12" letter-spacing="2.5" text-anchor="end">INTERFACE</text>

  </g>
  <rect x="0.75" y="0.75" width="998.5" height="298.5" rx="20" fill="none" stroke="#E4C4C8" stroke-width="1.5"/>
</svg>
