<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="t d">
  <title id="t">Campus Wayfinding</title>
  <desc id="d">Offline touchscreen kiosk for the SLSU main campus. Illustration of a campus map with a walking route from a current-location dot to a destination pin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/><stop offset="0.6" stop-color="#0B0F1A"/><stop offset="1" stop-color="#0B1E45"/>
    </linearGradient>
    <radialGradient id="glow" cx="880" cy="77" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.5"/><stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9CC0FF" opacity="0.09"/></pattern>
    <clipPath id="clip"><rect width="1000" height="220" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; } .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .t { fill: #EEF3FB; } .m { fill: #9FB0CC; } .a { fill: #5B9BFF; }
    .ln { fill: none; stroke: #2B4C8C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .la { fill: none; stroke: #5B9BFF; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .sh { fill: #0E1524; stroke: #2B4C8C; stroke-width: 2; stroke-linejoin: round; }
    
    .route { fill: none; stroke: #5B9BFF; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 9; animation: walk 1.2s linear infinite; }
    .ring { fill: none; stroke: #5B9BFF; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
    @keyframes walk { to { stroke-dashoffset: -22; } }
    @keyframes ping { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(2.4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <rect width="1000" height="220" fill="url(#dots)"/>
    <rect width="1000" height="220" fill="url(#glow)"/>
    <text class="mono a" x="48" y="58" font-size="14" font-weight="700">01</text>
    <text class="mono m" x="80" y="58" font-size="13" letter-spacing="2.5">THESIS · TEAM OF TWO · IN PROGRESS</text>
    <text class="sans t" x="46" y="124" font-size="46" font-weight="800" letter-spacing="-0.8">Campus Wayfinding</text>
    <text class="sans m" x="48" y="162" font-size="20">Offline touchscreen kiosk for the SLSU main campus</text>
    <g transform="translate(660,34)">
      <rect class="sh" x="0" y="26" width="70" height="44" rx="5"/>
      <rect class="sh" x="92" y="16" width="58" height="54" rx="5"/>
      <rect class="sh" x="174" y="34" width="112" height="36" rx="5"/>
      <rect class="sh" x="8" y="94" width="88" height="56" rx="5"/>
      <rect class="sh" x="128" y="94" width="56" height="56" rx="5"/>
      <rect class="sh" x="206" y="94" width="80" height="56" rx="5"/>
      <path class="route" d="M112 150 V82 H162 V22 H230"/>
      <circle class="ring" cx="112" cy="150" r="7"/>
      <circle cx="112" cy="150" r="6" fill="#5B9BFF"/>
      <path d="M230 26 L220 9 A11.5 11.5 0 1 1 240 9 Z" fill="#5B9BFF"/>
      <circle cx="230" cy="3" r="4" fill="#0E1524"/>
    </g>

  </g>
  <rect x="0.75" y="0.75" width="998.5" height="218.5" rx="18" fill="none" stroke="#18294F" stroke-width="1.5"/>
</svg>
